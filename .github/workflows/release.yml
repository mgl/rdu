name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/nfpm.yaml"
      - "scripts/package.sh"
      - "scripts/repository.sh"
      - "scripts/test-repository.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Containerfile"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the checked-in Rust toolchain
        run: |
          rustup show
          rustup target add "$TARGET"
          sudo apt-get update
          sudo apt-get install --yes musl-tools
        env:
          TARGET: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked |
            python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rdu"))')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version v$version"
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Test and build static binary
        run: |
          cargo test --locked --target "$TARGET"
          cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - name: Package and smoke-test binary
        run: |
          mkdir -p dist smoke
          tar -czf "dist/rdu-$TARGET.tar.gz" \
            -C "target/$TARGET/release" rdu \
            -C "$GITHUB_WORKSPACE" LICENSE README.md
          tar -xzf "dist/rdu-$TARGET.tar.gz" -C smoke
          smoke/rdu --version
          smoke/rdu --help
          smoke/rdu -n -s smoke
          if readelf -l smoke/rdu | grep -q INTERP; then
            echo "::error::Release binary requires a dynamic loader"
            exit 1
          fi
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: rdu-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  container:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: rdu-*
          path: dist
          merge-multiple: true
      - name: Prepare container build context
        run: |
          context="$RUNNER_TEMP/container"
          mkdir -p "$context/amd64" "$context/arm64"
          tar -xzf dist/rdu-x86_64-unknown-linux-musl.tar.gz -C "$context/amd64" rdu
          tar -xzf dist/rdu-aarch64-unknown-linux-musl.tar.gz -C "$context/arm64" rdu
          cp LICENSE "$context/"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Smoke-test container images
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" \
              --file Containerfile --load --tag "rdu:test-$arch" "$RUNNER_TEMP/container"
            docker run --rm --platform "linux/$arch" rdu:test-"$arch" --version
            docker run --rm --platform "linux/$arch" rdu:test-"$arch" --help
            docker run --rm --platform "linux/$arch" --read-only --network none \
              --cap-drop ALL --user "$(id -u):$(id -g)" \
              --volume "$GITHUB_WORKSPACE:/data:ro" rdu:test-"$arch" -n -s /data
          done
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=ref,event=pr
      - uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/container
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  packages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: rdu-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install packaging tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          sudo apt-get update
          sudo apt-get install --yes apt-utils createrepo-c rpm
      - name: Restore package repository
        run: |
          repository="$RUNNER_TEMP/package-repository"
          remote_ref="$(git ls-remote origin refs/heads/gh-pages)"
          if [[ -n "$remote_ref" ]]; then
            git fetch origin refs/heads/gh-pages
            git worktree add --detach "$repository" FETCH_HEAD
          else
            git worktree add --detach "$repository"
            git -C "$repository" switch --orphan package-repository
          fi
      - name: Build and test signed packages and repositories
        env:
          SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_RELEASE: ${{ github.ref_type == 'tag' }}
        run: |
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          trap 'gpgconf --kill all; rm -rf -- "$GNUPGHOME"' EXIT
          export RPM_SIGNING_KEY_FILE="$GNUPGHOME/signing-key.asc"
          if [[ "$IS_RELEASE" == true ]]; then
            if [[ -z "$SIGNING_KEY" ]]; then
              echo "::error::Set PACKAGE_SIGNING_KEY and PACKAGE_SIGNING_PASSPHRASE before releasing"
              exit 1
            fi
            printf '%s\n' "$SIGNING_KEY" > "$RPM_SIGNING_KEY_FILE"
            gpg --batch --import "$RPM_SIGNING_KEY_FILE"
            version="${RELEASE_TAG#v}"
          else
            export SIGNING_PASSPHRASE=""
            gpg --batch --pinentry-mode loopback --passphrase '' \
              --quick-generate-key 'rdu CI <ci@example.invalid>' rsa3072 sign 1d
            gpg --batch --armor --export-secret-keys > "$RPM_SIGNING_KEY_FILE"
            version="$(cargo metadata --no-deps --format-version 1 --locked |
              jq -r '.packages[] | select(.name == "rdu") | .version')"
          fi
          fingerprint="$(gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint"
          export NFPM_RPM_PASSPHRASE="$SIGNING_PASSPHRASE"
          bash scripts/package.sh "$version" dist
          bash scripts/repository.sh dist "$RUNNER_TEMP/package-repository" "$fingerprint"
          bash scripts/test-repository.sh dist "$RUNNER_TEMP/package-repository"
      - uses: actions/upload-artifact@v7
        with:
          name: native-packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
      - name: Generate checksums
        if: github.ref_type == 'tag'
        working-directory: dist
        run: sha256sum -- rdu-*.tar.gz *.deb *.rpm > SHA256SUMS
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Save package repository
        if: github.ref_type == 'tag'
        working-directory: ${{ runner.temp }}/package-repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Publish packages for $RELEASE_TAG"
          git push origin HEAD:refs/heads/gh-pages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-pages-artifact@v5
        if: github.ref_type == 'tag'
        with:
          path: ${{ runner.temp }}/package-repository

  deploy:
    if: github.ref_type == 'tag'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
