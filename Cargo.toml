[package]
name = "rdu"
version = "0.1.4"
edition = "2024"
rust-version = "1.99.1"
description = "Very fast disk usage analyzer"
license = "MIT"
repository = "https://github.com/mgl/rdu"
readme = "README.md"
keywords = ["disk-usage", "filesystem", "terminal", "tui"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-deque = "0.8"
crossterm = "0.29.0"
jiff = "0.2.35"
natord = "1.0.9"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
rustc-hash = "2.1.3"
serde_json = "1.0.151"
smallvec = "1.15.2"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[profile.release]
# Optimize the syscall-heavy scanner and omit unwind tables.
lto = "fat"
codegen-units = 1
panic = "abort"
