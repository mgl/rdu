# Rust tooling and benchmark dependencies.

[tools]
# Benchmark dependencies are installed on demand.
"cargo:hyperfine" = "2.0.0"
"cargo:diskus" = "0.9.0"
"cargo:du-dust" = "1.2.6"
"cargo:parallel-disk-usage" = "0.24.0"
gdu = "5.38.0"
dua = "2.45.1"

[tasks.build]
description = "Build the Rust rdu binary"
run = "cargo build --release --locked"

[tasks.test]
description = "Run the Rust test suite"
run = "cargo test --locked"

[tasks.lint]
description = "Clippy with warnings denied"
run = "cargo clippy --all-targets --locked -- -D warnings"

[tasks.fmt]
description = "Format the Rust sources"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust source formatting"
run = "cargo fmt --all -- --check"

[tasks.scripts-check]
description = "Lint and test the shell scripts"
run = "shellcheck scripts/*.sh && bash scripts/test.sh"

[tasks.bench]
description = "Benchmark against diskus, dua, du, dust, pdu, ncdu and gdu"
run = "./scripts/bench.sh"

[tasks.bench-suite]
description = "Benchmark the canonical fixture suite"
run = "./scripts/bench-suite.sh"

[tasks.perf]
description = "Measure rdu CPU, memory and speed on real files"
run = "./scripts/perf.sh"

[settings]
idiomatic_version_file_enable_tools = ["rust"]
